<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Brain AI - Configuración</title>
    <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
    <link rel="stylesheet" href="styles/main.css">
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script>window._BRAIN_SHOW_SETTINGS = true;</script>
</head>
<body>
    <div id="brain-panel">
        <div id="status-bar">
            <span id="status-indicator" class="disconnected"></span>
            <span id="status-text">Inicializando...</span>
            <button id="settings-toggle" title="Configuración">&#9881;</button>
        </div>

        <div id="settings-section" style="display:block;">
            <div class="settings-field">
                <label>URL del servidor Brain</label>
                <input id="cfg-brain-url" type="text" placeholder="http://localhost:8000">
            </div>
            <div class="settings-field">
                <label>API Key</label>
                <input id="cfg-api-key" type="password" placeholder="sk-brain-...">
            </div>
            <div class="settings-field">
                <label>Modelo</label>
                <input id="cfg-model" type="text" placeholder="brain">
            </div>
            <div class="settings-actions">
                <button id="cfg-test" class="cfg-btn">Probar</button>
                <button id="cfg-save" class="cfg-btn cfg-btn-primary">Guardar</button>
                <span id="cfg-status"></span>
            </div>
        </div>

        <div id="messages">
            <div class="message message-assistant">
                <div class="msg-label">Brain</div>
                <div class="msg-content">Hola, soy Brain AI. Pregunta lo que necesites sobre tus datos.</div>
            </div>
        </div>

        <div id="input-area">
            <textarea id="user-input" placeholder="Pregunta a Brain sobre tus datos..." rows="2"></textarea>
            <button id="send-btn" disabled>Enviar</button>
        </div>
    </div>

    <script type="text/javascript" src="scripts/brain-client.js"></script>
    <script type="text/javascript" src="scripts/brain-events.js"></script>
    <script type="text/javascript" src="scripts/chat.js"></script>
</body>
</html>
