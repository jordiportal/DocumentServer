<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Datos BIW</title>
    <script type="text/javascript" src="./../v1/plugins.js"></script>
    <script type="text/javascript" src="./../v1/plugins-ui.js"></script>
    <link rel="stylesheet" href="./../v1/plugins.css">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #e8e8e8;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border-color: #d9d9d9;
            --accent-color: #446893;
            --accent-hover: #365a80;
            --success-color: #4caf50;
            --error-color: #f44336;
            --warning-color: #ff9800;
            --header-bg: linear-gradient(135deg, #446893 0%, #2d5a87 100%);
        }
        
        /* Dark theme overrides */
        body.theme-dark, body.theme-contrast-dark, body.theme-type-dark, body[class*="dark"] {
            --bg-primary: #2a2a2a;
            --bg-secondary: #333333;
            --bg-tertiary: #3d3d3d;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #808080;
            --border-color: #4a4a4a;
            --accent-color: #5a8ac0;
            --accent-hover: #6a9ad0;
            --header-bg: linear-gradient(135deg, #3a5a7c 0%, #2a4a6c 100%);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 11px;
            background-color: var(--background-normal, var(--bg-primary));
            color: var(--text-normal, var(--text-primary));
            padding: 12px;
            min-height: 100vh;
        }
        
        .header {
            background: var(--header-bg);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: center;
            color: #fff;
        }
        .header h1 { font-size: 14px; margin-bottom: 2px; font-weight: 600; }
        .header .subtitle { font-size: 10px; opacity: 0.85; }
        
        .status-bar {
            background: var(--background-toolbar, var(--bg-secondary));
            border: 1px solid var(--border-regular-control, var(--border-color));
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-indicator {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--warning-color);
            animation: pulse 1.5s infinite;
        }
        .status-indicator.connected { background: var(--success-color); animation: none; }
        .status-indicator.error { background: var(--error-color); animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .form-group { margin-bottom: 10px; }
        .form-group label { 
            display: block; 
            margin-bottom: 4px; 
            font-size: 10px; 
            color: var(--text-normal, var(--text-secondary));
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 7px 9px;
            border: 1px solid var(--border-regular-control, var(--border-color));
            border-radius: 3px;
            background: var(--background-normal, var(--bg-primary));
            color: var(--text-normal, var(--text-primary));
            font-size: 11px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        .queries-list {
            background: var(--background-toolbar, var(--bg-secondary));
            border: 1px solid var(--border-regular-control, var(--border-color));
            border-radius: 4px;
            max-height: 90px;
            overflow-y: auto;
        }
        .query-item {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-regular-control, var(--border-color));
            cursor: pointer;
            transition: background 0.15s;
        }
        .query-item:hover { 
            background: var(--highlight-button-hover, rgba(68, 104, 147, 0.1)); 
        }
        .query-item.selected { 
            background: var(--highlight-button-pressed, rgba(68, 104, 147, 0.2));
            border-left: 3px solid var(--accent-color);
        }
        .query-item:last-child { border-bottom: none; }
        .query-name { 
            font-weight: 600; 
            font-size: 11px;
            color: var(--text-normal, var(--text-primary));
        }
        .query-desc { 
            font-size: 9px; 
            color: var(--text-normal, var(--text-secondary));
            opacity: 0.8;
            margin-top: 2px;
        }
        
        .data-preview {
            background: var(--background-toolbar, var(--bg-secondary));
            border: 1px solid var(--border-regular-control, var(--border-color));
            border-radius: 4px;
            max-height: 120px;
            overflow: auto;
            margin-bottom: 10px;
        }
        .preview-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 9px;
        }
        .preview-table th, .preview-table td {
            padding: 5px 6px;
            border: 1px solid var(--border-regular-control, var(--border-color));
            text-align: left;
            white-space: nowrap;
            color: var(--text-normal, var(--text-primary));
        }
        .preview-table th { 
            background: var(--background-toolbar, var(--bg-tertiary));
            font-weight: 600;
            color: var(--text-normal, var(--text-primary));
        }
        
        .loading-text { 
            text-align: center; 
            padding: 15px; 
            color: var(--text-normal, var(--text-muted));
            font-size: 10px;
        }
        
        .error-msg {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid var(--error-color);
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 8px;
            font-size: 10px;
            color: var(--error-color);
        }
        
        .stats { 
            font-size: 10px; 
            color: var(--text-normal, var(--text-secondary));
            margin-bottom: 8px; 
            text-align: center;
        }
        
        .btn {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-regular-control, var(--border-color));
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) { 
            background: var(--accent-hover);
        }
        .btn-primary:disabled { 
            background: var(--bg-tertiary);
            border-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed; 
        }
        .btn-secondary {
            background: var(--background-normal, var(--bg-primary));
            color: var(--text-normal, var(--text-primary));
        }
        .btn-secondary:hover:not(:disabled) { 
            background: var(--highlight-button-hover, var(--bg-secondary));
        }
        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .footer { 
            margin-top: 10px; 
            text-align: center; 
            font-size: 9px; 
            color: var(--text-normal, var(--text-muted));
            opacity: 0.6;
        }
        
        /* Loader overlay */
        #loader-container {
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--background-normal, var(--bg-primary));
            opacity: 0.95;
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            z-index: 1000;
        }
        #loader-container.hidden { display: none; }
        .loader-spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader-text { 
            margin-top: 10px; 
            font-size: 11px;
            color: var(--text-normal, var(--text-secondary));
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Importar Datos BIW</h1>
        <div class="subtitle">SAP BW Query Executor</div>
    </div>

    <div class="status-bar">
        <div class="status-indicator" id="statusIndicator"></div>
        <span id="statusText">Conectando...</span>
    </div>

    <div class="form-group">
        <label>Servidor:</label>
        <input type="text" id="serverUrl" value="http://localhost:3000">
    </div>
    <div class="form-group">
        <label>API Key:</label>
        <input type="password" id="apiKey" placeholder="Bearer token">
    </div>

    <div class="form-group">
        <label>Queries BW disponibles:</label>
        <div class="queries-list" id="queriesList">
            <div class="loading-text">Cargando...</div>
        </div>
    </div>

    <div id="errorContainer"></div>
    <div class="stats" id="statsContainer"></div>

    <div class="data-preview" id="dataPreview">
        <div class="loading-text">Selecciona una query</div>
    </div>

    <button class="btn btn-secondary" id="btnExecute" disabled>
        ▶️ Ejecutar Query
    </button>

    <button class="btn btn-primary" id="btnInsert" disabled>
        ⬇️ Insertar en Hoja
    </button>

    <div class="footer">BIW Data Connector v3.9.15</div>

    <div id="loader-container" class="hidden">
        <div class="loader-spinner"></div>
        <div class="loader-text" id="loaderText">Cargando...</div>
    </div>

    <script>
        (function() {
            'use strict';
            
            // Aplicar tema de ONLYOFFICE
            function applyTheme() {
                if (window.Asc && window.Asc.plugin) {
                    const theme = window.Asc.plugin.theme;
                    if (theme) {
                        // Detectar si es tema oscuro
                        const isDark = theme.type === 'dark' || 
                                       theme.name?.includes('dark') || 
                                       theme.name?.includes('contrast');
                        
                        document.body.classList.remove('theme-light', 'theme-dark');
                        document.body.classList.add(isDark ? 'theme-dark' : 'theme-light');
                        
                        // Aplicar variables CSS del tema si están disponibles
                        if (theme.colors) {
                            const root = document.documentElement;
                            Object.entries(theme.colors).forEach(([key, value]) => {
                                root.style.setProperty('--' + key.replace(/_/g, '-'), value);
                            });
                        }
                    }
                }
            }
            
            // Escuchar cambios de tema
            if (window.Asc && window.Asc.plugin) {
                window.Asc.plugin.onThemeChanged = function(theme) {
                    applyTheme();
                };
            }
            
            // Queries BW disponibles (se cargan dinámicamente desde el proxy)
            const AVAILABLE_QUERIES = [];
            
            let selectedQuery = null;
            let currentData = null;
            let currentResult = null;
            
            const $ = id => document.getElementById(id);
            const statusIndicator = $('statusIndicator');
            const statusText = $('statusText');
            const queriesList = $('queriesList');
            const btnExecute = $('btnExecute');
            const btnInsert = $('btnInsert');
            const serverUrl = $('serverUrl');
            const apiKeyInput = $('apiKey');
            const errorContainer = $('errorContainer');
            const dataPreview = $('dataPreview');
            const statsContainer = $('statsContainer');
            const loaderContainer = $('loader-container');
            const loaderText = $('loaderText');
            
            // Cargar configuración persistida
            try {
                const savedUrl = localStorage.getItem('biw_server_url');
                const savedKey = localStorage.getItem('biw_api_key');
                if (savedUrl) serverUrl.value = savedUrl;
                if (savedKey) apiKeyInput.value = savedKey;
            } catch(e) {}
            
            function authHeaders() {
                const headers = { 'Content-Type': 'application/json' };
                const key = apiKeyInput.value.trim();
                if (key) headers['Authorization'] = `Bearer ${key}`;
                return headers;
            }
            
            function showLoader(text) {
                loaderText.textContent = text || 'Cargando...';
                loaderContainer.classList.remove('hidden');
            }
            
            function hideLoader() {
                loaderContainer.classList.add('hidden');
            }
            
            function showError(msg) {
                errorContainer.innerHTML = '<div class="error-msg">❌ ' + msg + '</div>';
            }
            
            function clearError() {
                errorContainer.innerHTML = '';
            }
            
            async function connect() {
                const url = serverUrl.value.trim();
                statusIndicator.className = 'status-indicator';
                statusText.textContent = 'Conectando...';
                clearError();
                
                // Persistir configuración
                try {
                    localStorage.setItem('biw_server_url', url);
                    localStorage.setItem('biw_api_key', apiKeyInput.value.trim());
                } catch(e) {}
                
                try {
                    const response = await fetch(url + '/health', { headers: authHeaders() });
                    if (!response.ok) throw new Error('Servicio no disponible');
                    
                    const info = await response.json();
                    statusIndicator.className = 'status-indicator connected';
                    statusText.textContent = 'Conectado - ' + (info.service || 'Proxy BIW');
                    await loadQueries();
                    
                } catch (error) {
                    statusIndicator.className = 'status-indicator error';
                    statusText.textContent = 'Sin conexión';
                    showError(error.message);
                    queriesList.innerHTML = '<div class="loading-text">❌ Error de conexión</div>';
                }
            }
            
            async function loadQueries() {
                try {
                    const url = serverUrl.value.trim();
                    const response = await fetch(url + '/api/bi/queries', { headers: authHeaders() });
                    if (!response.ok) throw new Error('Error cargando queries');
                    const data = await response.json();
                    const queries = data.queries || [];
                    
                    if (queries.length === 0) {
                        renderQueries();
                        return;
                    }
                    
                    AVAILABLE_QUERIES.length = 0;
                    queries.forEach(q => {
                        AVAILABLE_QUERIES.push({
                            name: q.name,
                            displayName: q.description || q.name,
                            description: q.catalog ? `Catálogo: ${q.catalog}` : ''
                        });
                    });
                    renderQueries();
                } catch(e) {
                    console.warn('[BIW] Error cargando queries dinámicas, usando lista estática:', e.message);
                    renderQueries();
                }
            }
            
            function renderQueries() {
                queriesList.innerHTML = AVAILABLE_QUERIES.map((q, idx) => `
                    <div class="query-item" data-idx="${idx}">
                        <div class="query-name">📊 ${q.displayName}</div>
                        <div class="query-desc">${q.description}</div>
                    </div>
                `).join('');
                
                queriesList.querySelectorAll('.query-item').forEach(item => {
                    item.addEventListener('click', function() {
                        queriesList.querySelectorAll('.query-item').forEach(i => i.classList.remove('selected'));
                        this.classList.add('selected');
                        selectedQuery = AVAILABLE_QUERIES[parseInt(this.dataset.idx)];
                        btnExecute.disabled = false;
                        btnInsert.disabled = true;
                        currentData = null;
                        currentResult = null;
                        dataPreview.innerHTML = '<div class="loading-text">Click en "Ejecutar Query"</div>';
                        statsContainer.textContent = '';
                    });
                });
            }
            
            async function executeQuery() {
                if (!selectedQuery) return;
                
                const url = serverUrl.value.trim();
                showLoader('Ejecutando ' + selectedQuery.displayName + '...');
                clearError();
                
                try {
                    // Cargar configuración guardada por el panel de filtros
                    let queryConfig = { query: selectedQuery.name };
                    try {
                        const savedConfig = localStorage.getItem('biw_query_config');
                        if (savedConfig) {
                            const config = JSON.parse(savedConfig);
                            if (config.query === selectedQuery.name || config.queryName === selectedQuery.name) {
                                queryConfig = {
                                    query: selectedQuery.name,
                                    measures: config.measures || config.selectedKeyFigures,
                                    dimension: config.dimension,
                                    filters: config.filters
                                };
                            }
                        }
                    } catch(e) {}
                    
                    const response = await fetch(url + '/api/bi/query', {
                        method: 'POST',
                        headers: authHeaders(),
                        body: JSON.stringify(queryConfig)
                    });
                    
                    if (!response.ok) {
                        const errBody = await response.json().catch(() => ({}));
                        throw new Error(errBody.details || errBody.error || 'Error ' + response.status);
                    }
                    
                    const result = await response.json();
                    
                    if (!result.success) {
                        throw new Error(result.error || 'Error ejecutando query');
                    }
                    
                    const rows = result.data || [];
                    
                    if (rows.length === 0) {
                        dataPreview.innerHTML = '<div class="loading-text">Sin datos</div>';
                        hideLoader();
                        return;
                    }
                    
                    currentData = rows;
                    currentResult = result;
                    const headers = Object.keys(rows[0]);
                    
                    // Preview en tabla
                    let html = '<table class="preview-table"><thead><tr>';
                    headers.slice(0, 5).forEach(h => html += '<th>' + h + '</th>');
                    if (headers.length > 5) html += '<th>...</th>';
                    html += '</tr></thead><tbody>';
                    
                    rows.slice(0, 4).forEach(row => {
                        html += '<tr>';
                        headers.slice(0, 5).forEach(h => {
                            let val = row[h];
                            if (typeof val === 'number') val = val.toLocaleString('es-ES');
                            html += '<td>' + (val ?? '-') + '</td>';
                        });
                        if (headers.length > 5) html += '<td>...</td>';
                        html += '</tr>';
                    });
                    
                    if (rows.length > 4) {
                        html += '<tr><td colspan="' + Math.min(headers.length, 6) + '" style="text-align:center;opacity:0.5">+' + (rows.length - 4) + ' filas más</td></tr>';
                    }
                    
                    html += '</tbody></table>';
                    dataPreview.innerHTML = html;
                    statsContainer.textContent = `📊 ${rows.length} filas × ${headers.length} columnas`;
                    btnInsert.disabled = false;
                    
                } catch (error) {
                    showError(error.message);
                    dataPreview.innerHTML = '<div class="loading-text">Error</div>';
                }
                
                hideLoader();
            }
            
            function insertData() {
                if (!currentData || currentData.length === 0) return;
                
                showLoader('Insertando datos...');
                
                if (window.Asc && window.Asc.plugin && window.Asc.plugin.sendToPlugin) {
                    const numFormat = localStorage.getItem('biw_number_format') || 'EU';
                    
                    window.Asc.plugin.sendToPlugin("onInsertData", {
                        query: selectedQuery,
                        rows: currentData,
                        columns: currentResult?.columns || null,
                        multiLevelHeaders: currentResult?.multiLevelHeaders || null,
                        numberFormat: numFormat
                    });
                }
                
                setTimeout(hideLoader, 500);
            }
            
            window.Asc.plugin.init = function() { 
                applyTheme();
                connect(); 
            };
            
            window.Asc.plugin.button = function(id) {
                if (id === 0 && currentData) insertData();
                else if (id === 1 || id === -1) window.Asc.plugin.executeMethod("CloseWindow");
            };
            
            btnExecute.addEventListener('click', executeQuery);
            btnInsert.addEventListener('click', insertData);
            serverUrl.addEventListener('change', connect);
            apiKeyInput.addEventListener('change', connect);
        })();
    </script>
</body>
</html>
